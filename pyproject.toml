[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "boto3>=1.43.125",
    "dbt-duckdb>=1.11.1",
    "kafka-python>=3.0.12",
    "pandas-market-calendars>=5.5.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "requests>=2.34.2",
    "schedule>=1.2.2",
    "slack-sdk>=3.46.0",
    "websocket-client>=1.9.2",
]

[dependency-groups]
dev = [
    "boto3-stubs-lite[s3]>=1.43.125",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]
